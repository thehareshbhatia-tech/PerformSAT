name: CI

# CI gate (expanded 2026-06-09 for public-launch prep). Two parallel jobs on
# every push/PR to main:
#   test      — Jest unit tests + math/R&W content-bank validators + a
#               production build (catches eslint warnings-as-errors and
#               broken imports that tests alone miss).
#   functions — Cloud Functions typecheck (tsc --noEmit) + unit tests on
#               node 24 (matches functions/package.json engines).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: CI=true npx react-scripts test --watchAll=false
      - name: Validate math bank
        run: npm run bank:validate
      - name: Validate R&W bank
        run: node scripts/validateRWBank.mjs --all
      - name: Production build
        run: npm run build

  functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Functions unit tests
        run: npm test
